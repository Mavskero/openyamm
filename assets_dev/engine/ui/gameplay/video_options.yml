screen: VideoOptions

elements:
  - id: VideoOptionsRoot
    anchor: center
    width: 640
    height: 480
    z_index: 440
    visible: true
    scale:
      min: 1.0
      max: 8.0
    children:
      - id: VideoOptionsBackground
        anchor: top_left
        offset_x: 0
        offset_y: 0
        width: 640
        height: 480
        z_index: 0
        asset:
          default: optvid

      - id: VideoOptionsBrightnessTitle
        anchor: top_left
        offset_x: 70
        offset_y: 153
        width: 227
        height: 28
        z_index: 20
        asset:
          default: bl_brite

      - id: VideoOptionsPreviewTitle
        anchor: top_left
        offset_x: 351
        offset_y: 153
        width: 227
        height: 28
        z_index: 20
        asset:
          default: bl_prevu

      - id: VideoOptionsBrightnessLeftButton
        anchor: top_left
        offset_x: 70
        offset_y: 224
        width: 17
        height: 18
        z_index: 20
        interactive: true
        asset:
          default: ar_lt_up
          highlighted: ar_lt_ht
          pressed: ar_lt_dn

      - id: VideoOptionsBrightnessTrack
        anchor: top_left
        offset_x: 91
        offset_y: 224
        width: 185
        height: 18
        z_index: 20
        interactive: true

      - id: VideoOptionsBrightnessThumb
        anchor: top_left
        offset_x: 91
        offset_y: 224
        width: 17
        height: 18
        z_index: 21
        asset:
          default: convol50

      - id: VideoOptionsBrightnessRightButton
        anchor: top_left
        offset_x: 280
        offset_y: 224
        width: 17
        height: 18
        z_index: 20
        interactive: true
        asset:
          default: ar_rt_up
          highlighted: ar_rt_ht
          pressed: ar_rt_dn

      - id: VideoOptionsBrightnessMinimumLabel
        anchor: top_left
        offset_x: 70
        offset_y: 202
        width: 44
        height: 18
        z_index: 20
        text:
          value: "50%"
          font: Lucida
          color: white
          align_x: left
          align_y: middle

      - id: VideoOptionsBrightnessDefaultLabel
        anchor: top_left
        offset_x: 149
        offset_y: 202
        width: 69
        height: 18
        z_index: 20
        text:
          value: "100%"
          font: Lucida
          color: white
          align_x: center
          align_y: middle

      - id: VideoOptionsBrightnessMaximumLabel
        anchor: top_left
        offset_x: 253
        offset_y: 202
        width: 44
        height: 18
        z_index: 20
        text:
          value: "200%"
          font: Lucida
          color: white
          align_x: right
          align_y: middle

      - id: VideoOptionsBrightnessValueLabel
        anchor: top_left
        offset_x: 70
        offset_y: 254
        width: 227
        height: 26
        z_index: 20
        text:
          value: "{display_gamma}"
          font: Create
          color: white
          align_x: center
          align_y: middle

      - id: VideoOptionsPreviewFrame
        anchor: top_left
        offset_x: 327
        offset_y: 196
        width: 273
        height: 167
        z_index: 20

      - id: VideoOptionsBloodSplatsButton
        anchor: top_left
        offset_x: 66
        offset_y: 354
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_blspU
          pressed: bl_blspD

      - id: VideoOptionsColoredLightsButton
        anchor: top_left
        offset_x: 66
        offset_y: 383
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_coltU
          pressed: bl_coltD

      - id: VideoOptionsTintingButton
        anchor: top_left
        offset_x: 66
        offset_y: 412
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_tintU
          pressed: bl_tintD

      - id: VideoOptionsReturnButton
        anchor: top_left
        offset_x: 350
        offset_y: 381
        width: 227
        height: 50
        z_index: 20
        interactive: true
        asset:
          default: bv_rtrnU
          highlighted: bv_rtrnH
          pressed: bv_rtrnD
