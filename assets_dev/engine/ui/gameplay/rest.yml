screen: Rest

# Unlettered parts of the original 6UI marble and green stone panels replace only
# the baked caption interiors. Button edges, pressed states and the food icon stay visible.
texture_regions:
  - {name: rest_heal_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 65, y: 159, width: 205, height: 34}
  - {name: rest_wait_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 382, y: 160, width: 178, height: 26}
  - {name: rest_dawn_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 103, y: 242, width: 182, height: 24}
  - {name: rest_hour_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 103, y: 274, width: 182, height: 24}
  - {name: rest_minutes_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 103, y: 306, width: 182, height: 24}
  - {name: rest_exit_caption_bg, source: restmain, source_width: 640, source_height: 367,
     x: 365, y: 303, width: 177, height: 34}

elements:
  - id: RestRoot
    anchor: center
    width: 640
    height: 480
    z_index: 430
    visible: true
    scale:
      min: 1.0
      max: 8.0
    children:
      - id: RestBackground
        anchor: top_left
        offset_x: 0
        offset_y: 0
        width: 640
        height: 366
        z_index: 0
        asset:
          default: restmain

      - id: RestSkyAnimation
        anchor: top_left
        offset_x: 96
        offset_y: 26
        width: 444
        height: 108
        z_index: 10
